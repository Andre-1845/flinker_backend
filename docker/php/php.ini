; Ajustes gerais de PHP pra produção. upload_max_filesize/post_max_size cobrem
; upload de comprovantes/fotos de perfil (Fase 3/4) sem precisar mexer aqui de
; novo depois.
memory_limit=256M
upload_max_filesize=10M
post_max_size=12M
max_execution_time=60
expose_php=Off
date.timezone=America/Sao_Paulo
