; Config de OPcache pra produção. Sem isso, cada request recompila o PHP do
; zero — funciona, mas é bem mais lento do que precisa ser num app que vai
; rodar numa VPS modesta (o cenário-alvo é Hostinger ou similar, não um
; cluster grande).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
